name: Build Boutika (APK + EXE)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            script: build:win
          - arch: ia32
            script: build:win32

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare desktop
        run: node tools/prepare-desktop.js

      - name: Install (Electron 22 = يعمل على Windows 7/8/10/11، 32 و 64 بت)
        working-directory: desktop
        run: |
          npm install
          npm install --save-dev electron@22.3.27

      - name: Build EXE (${{ matrix.arch }})
        working-directory: desktop
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: boutika-windows-${{ matrix.arch }}
          path: desktop/dist/*.exe
          if-no-files-found: error

  android-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Capacitor + Node.js plugin
        run: |
          npm install
          npm install https://github.com/hampoelz/capacitor-nodejs/releases/download/v1.0.0-beta.8/capacitor-nodejs.tgz

      - name: Embed server + capacitor config
        run: |
          cd boutika-server
          npm install --omit=dev
          cd ..
          node tools/prepare-android.js pre
          cd www/nodejs
          npm install --omit=dev

      - name: Add Android platform
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Patch Android
        run: |
          node tools/prepare-android.js post
          npx cap sync android
          chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Boutika.apk

      - uses: actions/upload-artifact@v4
        with:
          name: boutika-android
          path: Boutika.apk
          if-no-files-found: error

  release:
    needs: [windows-exe, android-apk]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Boutika Build ${{ github.run_number }}
          files: |
            out/boutika-windows-*/*.exe
            out/boutika-android/Boutika.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
